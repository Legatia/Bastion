name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bastion
            asset_name: bastion-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bastion
            asset_name: bastion-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bastion
            asset_name: bastion-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cd cli
          cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Linux/macOS)
        run: |
          cd cli/target/${{ matrix.target }}/release
          tar -czf ../../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}.tar.gz
